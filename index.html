<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Go Run!</title>

<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Press Start 2P",cursive}

body{
  background:url('bg.gif') no-repeat center center fixed;
  background-size:cover;
}

#soundBtn{
  position:fixed;
  top:20px;
  left:20px;
  z-index:999;
  padding:8px;
  font-size:18px;
  background:rgba(0,0,0,.5);
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}

.game{position:relative;width:100vw;height:100vh}
.player{position:absolute;left:1%;bottom:10%;width:120px}
.obstacle{position:absolute;bottom:10%;width:26px;left: 90%;}

#startText{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  color:#ff0066;
  animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

#score{position:absolute;top:20px;right:30px;color:#ff0066}

#gameOver{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  color:#fff;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:20px;
  z-index:1000;
}

#restart{
  padding:16px 30px;
  font-family:"Press Start 2P";
  background:#ff69b4;
  border:none;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="soundBtn">🔊</div>

<div class="game" id="game">
  <img src="player.gif" class="player" id="player">
  <img src="obstacle.png" class="obstacle" id="obstacle">
  <div id="startText">TAP / SPACE TO JUMP 🎮</div>
  <div id="score">0</div>
</div>

<div id="gameOver">
  <div>GAME OVER ⚠️</div>
  <div id="finalScore"></div>
  <button id="restart">PLAY AGAIN</button>
</div>

<audio id="jumpSound" src="jump.wav"></audio>
<audio id="gameOverSound" src="gameover.wav"></audio>
<audio id="bgm" src="bgm.mp3" loop></audio>

<script>
/* DEVICE CHECK */
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* ELEMENTS */
const game=document.getElementById("game");
const player=document.getElementById("player");
const obstacle=document.getElementById("obstacle");
const scoreText=document.getElementById("score");
const startText=document.getElementById("startText");
const gameOverScreen=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");
const restartBtn=document.getElementById("restart");
const soundBtn=document.getElementById("soundBtn");

const jumpSound=document.getElementById("jumpSound");
const gameOverSound=document.getElementById("gameOverSound");
const bgm=document.getElementById("bgm");

/* STATE */
let running=false,isGameOver=false,soundOn=true;
let score=0,y=0,velocity=0;
let obstacleX=window.innerWidth,speed=4;
let audioUnlocked=!isMobile;

/* MOBILE AUDIO UNLOCK */
function unlockAudio(){
  if(audioUnlocked) return;
  bgm.play().then(()=>{
    bgm.pause();
    bgm.currentTime=0;
    audioUnlocked=true;
  }).catch(()=>{});
}
if(isMobile){
  document.addEventListener("touchstart",unlockAudio,{once:true});
}

/* SOUND TOGGLE */
soundBtn.onclick=()=>{
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?"🔊":"🔇";
  if(soundOn&&running&&audioUnlocked) bgm.play();
  else bgm.pause();
};

/* GAME LOOP */
function gameLoop(){
  if(!running) return;

  velocity-=0.8;
  y+=velocity;
  if(y<0){y=0;velocity=0}
  player.style.transform=`translateY(${-y}px)`;

  obstacleX-=speed;
  obstacle.style.left=obstacleX+"px";

  if(obstacleX<-100){
    score++;
    scoreText.textContent=score;
    obstacleX=window.innerWidth+300;
  }

  const p=player.getBoundingClientRect();
  const o=obstacle.getBoundingClientRect();
  if(p.right>o.left+20 && p.left<o.right-20 && p.bottom>o.top+15){
    endGame();return;
  }

  requestAnimationFrame(gameLoop);
}

/* START */
function startGame(){
  running=true;
  isGameOver=false;
  score=0;
  y=0;velocity=0;
  obstacleX=window.innerWidth+300;
  scoreText.textContent=0;
  startText.style.display="none";
  gameOverScreen.style.display="none";

  if(soundOn&&audioUnlocked){
    bgm.currentTime=0;
    bgm.play();
  }
  requestAnimationFrame(gameLoop);
}

/* END */
function endGame(){
  running=false;
  isGameOver=true;
  bgm.pause();
  if(soundOn){
    gameOverSound.currentTime=0;
    gameOverSound.play();
  }
  finalScore.textContent="Score: "+score;
  gameOverScreen.style.display="flex";
}

/* JUMP */
function jump(){
  if(isGameOver) return;
  if(!running) startGame();
  if(y===0){
    velocity=18;
    if(soundOn){
      jumpSound.currentTime=0;
      jumpSound.play();
    }
  }
}

game.addEventListener("touchstart",jump);
document.addEventListener("keydown",e=>{if(e.code==="Space")jump()});
restartBtn.onclick=startGame;

/* SERVICE WORKER */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
